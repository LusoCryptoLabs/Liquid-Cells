[package]
name = "liquid-cells-wasm"
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LusoCryptoLabs/Liquid-Cells"

# Standalone (not in the lean root workspace): a wasm32 cdylib for the browser/JS, plus an rlib so
# the pure serialization helpers test natively. The WHOLE point is that this wraps the SAME
# `liquid-cells-stf` / `liquid-cells-client` the sequencer and contract run, so a JS client signs
# over the identical byte layouts and rebuilds the identical keccak SMT, no divergent-root class of
# bug is reintroduced in another language.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `bundle` aligns the browser SDK with the re-baked guest's codec (compact_smt SMT + da_varint DA), so
# in-browser reconstruction rebuilds the right root. The codec is feature-coupled (v2 re-bake finding):
# without it the WASM SDK reads a bundle pool's DA with the deployed layout and rebuilds a wrong root.
# OFF by default so the deployed wasm matches the deployed (feature-off) stack; flip at the coordinated
# re-bake (build.sh: add `--features bundle`). Validated to build + pass the node smoke test under it.
bundle = [
    "liquid-cells-client/compact_smt", "liquid-cells-client/da_varint",
    "liquid-cells-stf/compact_smt", "liquid-cells-stf/da_varint",
]

[dependencies]
liquid-cells-client = { path = "../client", features = ["wire"] }
liquid-cells-stf = { path = "../stf" }
wasm-bindgen = "0.2"
serde_json = "1"
hex = "0.4"

# k256 -> getrandom needs its "js" backend to build for wasm32 (signing is deterministic RFC 6979,
# so no randomness is used at runtime; this only satisfies the build).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true

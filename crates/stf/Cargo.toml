[package]
name = "liquid-cells-stf"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Deterministic state-transition function for the Liquid Cells trustless pooled-balance rollup on Nervos CKB. Executed by the sequencer and proven verbatim by SP1."

[lib]
name = "liquid_cells_stf"
path = "src/lib.rs"

[features]
# `journal` adds host/sequencer-only codec helpers (encode_batch/decode_batch) used by the
# durable write-ahead journal. Gated OFF by default so the SP1 guest never compiles them,
# keeping the proven guest ELF (and its vkey 0x00213af5…) byte-stable. The sequencer enables it.
journal = []
# `min_fee` turns the protocol per-intent fee floor (MIN_FEE_PER_LEAF) into a *proven* in-STF
# invariant. Gated OFF by default for the SAME reason as `journal`: enabling it changes the
# guest ELF and therefore re-bakes the vkey, so it must be OFF in the deployed guest and is
# staged here for a coordinated post-audit upgrade. The sequencer enforces the same floor as
# admission policy today (see `liquid_cells_sequencer::FeePolicy`), so the economics already
# hold operationally; flipping this on makes them unforgeable. Verify-vkey asserts it is OFF.
# Validated in isolation by `tests/min_fee.rs` (the rest of the suite assumes the floor is off).
min_fee = []
# `compact_smt` swaps the deployed depth-256 sparse Merkle tree for the compact
# (pass-through) tree in `src/smt_compact.rs`, cutting SMT proving cost from
# O(touched · 256) keccaks to ~O(touched · log pool). Gated OFF for the SAME reason as
# `min_fee`: it changes the node-hashing rules, hence the guest ELF and the vkey, so it
# must be OFF in the deployed guest and is staged here for the coordinated post-audit
# re-bake bundle. When OFF the `#[cfg]` redirects compile byte-identically to today, so
# the deployed vkey (0x00213af5…) stays reproducible. Validated against the live scheme
# in `tests/compact_smt.rs` (`cargo test -p liquid-cells-stf --features compact_smt`).
compact_smt = []
# `hash_count` exposes a process-global keccak-call counter (`hash::count`) used by the
# compact-SMT cost test to measure the proving-cycle win. Test-only and OFF by default,
# so it is absent from the guest ELF and never perturbs the vkey.
hash_count = []
# `htlc_sha256` switches the in-pool HTLC preimage check from keccak to SHA-256
# (`sha256(preimage) == hashlock`), so the pool swap leg can share one hashlock with a Fiber /
# Bitcoin-Lightning HTLC, whose `HashAlgorithm` is Sha256 (Fiber has no keccak option). An atomic
# swap needs both legs locked to the SAME hash of one secret, so this is the prerequisite for the
# Fiber dust-egress leg (docs/EGRESS.md). Gated OFF for the SAME reason as the others: it changes
# the guest ELF, hence the vkey, so it is staged for the coordinated post-audit re-bake. Only the
# claim check changes (statement-level `#[cfg]` => byte-identical off; `htlc_id` and the anchor
# contract are untouched, they never hash a preimage). `sha2` is an OPTIONAL dep pulled only by
# this feature, so the deployed guest never compiles it. At flip-on, pin `sha2` to the SP1
# sha256-precompile patch (as `sha3` is pinned for keccak). Validated in `tests/htlc_sha256.rs`.
htlc_sha256 = ["dep:sha2"]
# `reject_high_s` makes `sig::verify` reject high-S (malleable) ECDSA signatures outright
# instead of normalizing them, closing THREAT-MODEL L3 (signature-bytes malleability). Gated
# OFF for the SAME reason as the others: it changes the guest ELF, hence the vkey, so it is
# staged for the coordinated post-audit re-bake bundle. When OFF the `#[cfg]` keeps `verify`
# byte-identical, so the deployed vkey stays reproducible. Validated in `tests/high_s.rs`.
reject_high_s = []
# `da_varint` LEB128 varint-encodes the balance/nonce in each DA blob record (the 32-byte key
# stays fixed), shrinking the recurring on-chain DA footprint ~30-40% for typical small amounts.
# Gated OFF for the SAME reason as the others: it changes the bytes the guest commits as
# `da_commitment`, hence the guest ELF and the vkey, so it is staged for the coordinated re-bake.
# Only `encode_da_blob` is in the guest path and the `#[cfg]` there is statement-level, so the OFF
# build is byte-identical and the deployed vkey stays reproducible. The anchor only checks
# `keccak(blob) == da_commitment`, so it is layout-agnostic. Validated in `tests/da_varint.rs`.
da_varint = []

[dependencies]
# Keccak-256: chosen over CKB-native blake2b because SP1 has a keccak precompile,
# so the same hashing is cheap inside the zkVM and native in the sequencer.
# Pinned to 0.10.8 to match the SP1 keccak-precompile patch tag used by the guest.
sha3 = { version = "=0.10.8", default-features = false }
# secp256k1 ECDSA: native here, patched to the SP1 secp256k1 precompile in the guest.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "std"] }
# SHA-256: optional, only compiled under `htlc_sha256` (the Fiber-compatible HTLC hashlock). Pinned
# to the same 0.10.8 line as sha3 so it can be patched to the SP1 sha256 precompile at flip-on.
sha2 = { version = "=0.10.8", default-features = false, optional = true }

[dev-dependencies]
hex = "0.4"

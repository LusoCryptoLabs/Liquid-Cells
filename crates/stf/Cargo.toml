[package]
name = "liquid-cells-stf"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Deterministic state-transition function for the Liquid Cells trustless pooled-balance rollup on Nervos CKB. Executed by the sequencer and proven verbatim by SP1."

[lib]
name = "liquid_cells_stf"
path = "src/lib.rs"

[features]
# `journal` adds host/sequencer-only codec helpers (encode_batch/decode_batch) used by the
# durable write-ahead journal. Gated OFF by default so the SP1 guest never compiles them,
# keeping the proven guest ELF (and its vkey 0x00213af5…) byte-stable. The sequencer enables it.
journal = []

[dependencies]
# Keccak-256: chosen over CKB-native blake2b because SP1 has a keccak precompile,
# so the same hashing is cheap inside the zkVM and native in the sequencer.
# Pinned to 0.10.8 to match the SP1 keccak-precompile patch tag used by the guest.
sha3 = { version = "=0.10.8", default-features = false }
# secp256k1 ECDSA: native here, patched to the SP1 secp256k1 precompile in the guest.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic", "std"] }

[dev-dependencies]
hex = "0.4"

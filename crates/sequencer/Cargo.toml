[package]
name = "liquid-cells-sequencer"
version = "0.0.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

# The sequencer is the off-chain half of the keystone: it runs the SAME
# `liquid-cells-stf` the SP1 guest proves, accepts signed intents into a mempool,
# and seals successive checkpoints. It deliberately depends ONLY on the STF (no
# sp1-sdk), so it stays in the lean workspace and its loop logic tests in
# milliseconds; proving + CKB submission live in a separate driver.
[dependencies]
liquid-cells-stf = { path = "../stf", features = ["journal"] }

[features]
# `htlc_keyspace` forwards the STF's H-1 escrow-keyspace fix so the resilient-seal validation
# (resilient.rs) mirrors the proven apply_ops under that staged change. Without it, seal_resilient
# would DROP exactly the top-up/front-run recovery intents the STF accepts, defeating the fix on the
# resilient cadence. OFF by default (matches the deployed guest), staged for the coordinated re-bake.
htlc_keyspace = ["liquid-cells-stf/htlc_keyspace"]

# `htlc_sha256` forwards the STF's Fiber-compatible SHA-256 HTLC hashlock so the resilient-seal
# validation (resilient.rs) mirrors the proven apply_ops on the claim-preimage hash. Without it the
# mirror hashes with keccak and DROPS every valid sha256 claim (the Fiber dust-egress leg) as
# BadPreimage on the resilient cadence, even though seal_batch/apply accept it (audit A-1). OFF by
# default (matches the deployed guest); the re-bake bundle flips htlc_sha256 and htlc_keyspace on
# together, so the sequencer must forward BOTH (the fifth coordination point of the bundle).
htlc_sha256 = ["liquid-cells-stf/htlc_sha256"]

# The sequencer SEALS batches into the guest input + DA blob the re-baked guest reads, so it must build
# the STF with the SAME codec-affecting features as the guest or its output diverges (v2 re-bake
# finding: the runbook's earlier "htlc_keyspace htlc_sha256" list was incomplete). `compact_smt` (sparse
# witness siblings), `da_varint` (varint DA records) and `reject_high_s` (sig rule) all change what the
# sequencer produces/validates; forward them too. OFF by default; flip with the bundle at the re-bake.
compact_smt = ["liquid-cells-stf/compact_smt"]
da_varint = ["liquid-cells-stf/da_varint"]
reject_high_s = ["liquid-cells-stf/reject_high_s"]

# The end-to-end demo (`examples/demo.rs`) drives the sequencer with client-built,
# client-signed intents and then recovers a balance from L1 DA on the client side, so it
# needs the client SDK. Dev-only: it never enters the sequencer's own dependency graph.
[dev-dependencies]
liquid-cells-client = { path = "../client" }

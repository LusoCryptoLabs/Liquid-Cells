[package]
name = "liquid-cells-client"
version = "0.0.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }

# The client SDK: build + sign intents and reconstruct your own leaf from L1 data, using the
# EXACT `liquid-cells-stf` the sequencer and SP1 guest run. Reusing the canonical STF (rather
# than reimplementing its byte layouts / signing / SMT) is what guarantees a client can never
# disagree with the sequencer or the on-chain contract, the same "one STF, no divergence"
# discipline the whole protocol rests on. STF-only + blake2b (for the CKB secp lock args a
# force-exit pays to); no chain RPC here, so it stays in the lean workspace and tests fast.
[features]
# `cli` builds the `lc-exit` binary: a standalone DA-reconstruction + force-exit-witness tool that
# scrapes the checkpoint chain from a CKB RPC and rebuilds your leaf from L1 alone. Off by default so
# the SDK stays RPC-free and tests fast (the lib keeps no chain dependency).
cli = ["dep:ureq", "dep:native-tls", "dep:serde_json", "dep:hex"]
# `htlc_sha256` forwards the STF's Fiber-compatible SHA-256 HTLC hashlock so the swap-coordinator's
# end-to-end test settles the pool leg the way a deployed (post-re-bake) pool would. The coordinator
# logic itself is hash-agnostic; only that one test needs the STF to claim against sha256.
htlc_sha256 = ["liquid-cells-stf/htlc_sha256"]
# `fiber` builds the fnn-backed `CounterpartyLeg` (`fiber::FiberLeg`) + the `lc-swap` binary: the swap
# drivers run against a LIVE `fnn` node instead of `MockLeg`. Pulls the same HTTP stack as `cli`, plus
# `htlc_sha256` so the in-process pool leg claims under the Fiber-compatible sha256 hashlock.
fiber = ["dep:ureq", "dep:native-tls", "dep:serde_json", "dep:hex", "htlc_sha256"]
# `wire` builds the canonical JSON wire format (`wire` module): the single serialize/parse definition
# the WASM SDK and the sequencer service share, so the network encoding cannot drift between them.
wire = ["dep:serde_json", "dep:hex"]
# `htlc_keyspace` is the client half of audit fix H-1: `force_refund_witness` carries the actual
# committed escrow balance (16 bytes) so the contract can sweep a balance-altered escrow. OFF by
# default (matches the deployed FORCEREFUND_LEN 8321); flips with the contract/guest features at the
# coordinated re-bake. Pure witness-layout change, no extra deps.
htlc_keyspace = []
# `compact_smt` forwards the STF's compact (pass-through) SMT so `proof_from_da` reconstructs the leaf
# and inclusion siblings under the same scheme the post-re-bake committed root uses, hence the
# force-exit / force-refund witnesses this SDK builds verify against the compact on-chain `smt_root`.
# OFF by default (matches the deployed depth-256 tree); flips with the guest/contract at the re-bake.
compact_smt = ["liquid-cells-stf/compact_smt"]

[dependencies]
liquid-cells-stf = { path = "../stf" }
blake2b-ref = "0.3"
# SHA-256 for the Fiber-compatible swap hashlock H = sha256(secret). The client is not the SP1
# guest, so this is an ordinary dependency (no vkey concern); it is what lets a maker compute the
# H both the pool leg and a Fiber Sha256 HTLC lock to.
sha2 = "0.10"
# native-tls (OpenSSL) honors the system CA store, so the CLI traverses TLS-intercepting egress
# proxies that rustls' bundled roots reject; rustls is explicitly NOT used here.
ureq = { version = "2", default-features = false, features = ["native-tls"], optional = true }
native-tls = { version = "0.2", optional = true }
serde_json = { version = "1", optional = true }
hex = { version = "0.4", optional = true }

[[bin]]
name = "lc-exit"
path = "src/bin/lc-exit.rs"
required-features = ["cli"]

[[bin]]
name = "lc-swap"
path = "src/bin/lc-swap.rs"
required-features = ["fiber"]

# WebAssembly: k256 pulls getrandom transitively, which needs its "js" backend to build for
# wasm32. Signing is deterministic (RFC 6979), so no randomness is used at runtime; this only
# satisfies the build so the SAME stf can run in a browser. wasm32-only, so native builds are
# unaffected.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
hex = "0.4"
liquid-cells-sequencer = { path = "../sequencer" }

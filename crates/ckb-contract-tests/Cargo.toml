# Real CKB-VM integration tests for the Liquid Cells anchor type script. Standalone
# (its own [workspace], host target), loads the riscv contract binary + the Phase-2a
# fixtures and runs them through ckb-testtool's VM. Build the contract first.
[package]
name = "liquid-cells-ckb-tests"
version = "0.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"

# Helper that computes the withdrawal lock hash the proof must commit (so the test can
# build the identical output lock). ckb-testtool is a normal dep so the bin can use it.
[[bin]]
name = "wd_target"
path = "src/bin/wd_target.rs"

[dependencies]
ckb-testtool = "0.13"
hex = "0.4"
# Used by the tests to build a real SMT tree + inclusion proofs natively (no SP1 proof). A NORMAL
# (not dev) dependency so the `compact_smt` feature below can forward to it: Cargo only allows
# `dep/feature` forwarding to normal/build dependencies, not dev-dependencies.
liquid-cells-stf = { path = "../stf" }

[features]
# `htlc_keyspace` gates the force-refund tests to the widened (8337-byte) witness that the anchor,
# built with the same feature, expects (audit H-1 on-chain half). Run together:
#   (cd ../ckb-contract && cargo build --release --features htlc_keyspace)
#   cargo test --release --features htlc_keyspace --test forcerefund
htlc_keyspace = []

# `compact_smt` forwards the STF's compact (pass-through) SMT to the test's tree builder so the
# committed root, the leaf hashing, and the inclusion siblings are all the compact scheme, then the
# force-exit/force-refund suites verify the anchor's compact `smt_root` arm against it. Run together:
#   (cd ../ckb-contract && cargo build --release --features compact_smt)
#   cargo test --release --features compact_smt --test forceexit --test forcerefund
compact_smt = ["liquid-cells-stf/compact_smt"]

# blake160(pubkey) for the owner's secp lock args in the force-exit / force-refund tests.
[dev-dependencies]
blake2b-ref = "0.3"

[workspace]

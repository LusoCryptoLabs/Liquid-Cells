# Liquid Cells anchor type script (CKB-VM). Standalone (its own [workspace]), built
# for riscv64imac-unknown-none-elf with ckb-std. Verifies the SP1 Groth16 proof of a
# transition and pins its public values to chain facts.
[package]
name = "liquid-cells-ckb-contract"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "liquid-cells-anchor"
path = "src/main.rs"

[dependencies]
ckb-std = "0.16"
# ark-bn254: modern pure-Rust BN254. Measured ~66x faster per pairing than substrate-bn on
# CKB-VM (crates/bn-bench), so the verifier does the plain 4-pairing Groth16 check (no baked
# e(alpha,beta) precompute needed) at ~1-2% of the block cycle limit instead of ~99%.
ark-bn254 = { version = "0.4", default-features = false, features = ["curve"] }
ark-ec = { version = "0.4", default-features = false }
ark-ff = { version = "0.4", default-features = false }
sha2 = { version = "0.10", default-features = false }
# keccak for recomputing the deposits/withdrawals commitments (must match the STF's fold).
sha3 = { version = "=0.10.8", default-features = false }
# blake2b (ckb-default-hash personalization) for blake160(pubkey): force-exit payouts must
# land at the owner's canonical secp256k1_blake160 lock, so no in-contract signature check.
blake2b-ref = { version = "0.3", default-features = false }

[profile.release]
opt-level = 3
lto = false
panic = "abort"
codegen-units = 1
overflow-checks = false

[workspace]

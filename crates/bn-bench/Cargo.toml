# Throwaway microbench: cost of ONE BN254 pairing on CKB-VM, substrate-bn (our verifier's lib)
# vs ark-bn254 (modern pure-Rust). Measured under ckb-debugger to decide whether a pure-Rust
# verifier port actually beats the 3.47B-cycle baseline. Not part of the protocol.
[package]
name = "bn-bench"
version = "0.0.0"
edition = "2021"

[[bin]]
name = "bench-substrate"
path = "src/substrate.rs"

[[bin]]
name = "bench-ark"
path = "src/ark.rs"

[dependencies]
ckb-std = "0.16"
bn = { package = "substrate-bn-succinct-rs", path = "../ckb-contract/vendor/bn", default-features = false }
ark-bn254 = { version = "0.4", default-features = false, features = ["curve"] }
ark-ec = { version = "0.4", default-features = false }
ark-ff = { version = "0.4", default-features = false }
ark-std = { version = "0.4", default-features = false }

[profile.release]
opt-level = 3
lto = false
panic = "abort"
codegen-units = 1
overflow-checks = false

[workspace]

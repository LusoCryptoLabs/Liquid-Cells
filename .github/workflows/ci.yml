name: CI

# Cheap-tier CI: proves all nine vkey pin sites agree, runs the full test + adversarial
# red-team suites (STF / sequencer + the anchor contract in CKB-VM), and runs the WHOLE
# reduced re-bake bundle composed together (so the irreversible-vkey go-evidence is a
# reproduced CI artifact, not a one-time documented run, committee finding E). Deliberately
# does NOT do the heavy guest-ELF rebuild (which needs the sideloaded succinct toolchain +
# a pinned build path); that is a pre-mainnet add.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vkey-pins:
    name: vkey pin agreement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert all 9 vkey pin sites agree (contract VKEY_HASH + 4 host bins + 4 fixtures)
        run: bash scripts/verify-vkey.sh

  stf-sequencer-tests:
    name: STF + sequencer + client tests (incl. red-team + DA reconstruction)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test stf + sequencer + client (journal feature on via sequencer)
        run: cargo test -p liquid-cells-stf -p liquid-cells-sequencer -p liquid-cells-client
      - name: Test the staged in-proof min-fee floor (vkey-affecting; OFF in the deployed guest)
        run: cargo test -p liquid-cells-stf --features min_fee --test min_fee
      - name: Test the staged compact SMT vs the live depth-256 tree (vkey-affecting; OFF in the guest)
        run: cargo test -p liquid-cells-stf --features "compact_smt hash_count"
      - name: Test the staged high-S rejection (THREAT-MODEL L3; vkey-affecting; OFF in the guest)
        run: cargo test -p liquid-cells-stf --features reject_high_s
      - name: Test the staged DA-blob varint layout (vkey-affecting; OFF in the guest)
        run: cargo test -p liquid-cells-stf --features da_varint
      - name: Test the staged SHA-256 HTLC hashlock (Fiber-compat; vkey-affecting; OFF in the guest)
        run: cargo test -p liquid-cells-stf --features htlc_sha256
      - name: Re-bake go-evidence -- the WHOLE reduced bundle composes (fuzz + red-team under all 5 at once)
        # The exact security feature-set the v2 re-bake will turn ON together (ecrecover + min_fee are
        # deferred to a later, separately-reviewed re-bake). Re-runs fuzz.rs + redteam.rs (the
        # no-debit-without-sig / value-conservation / shadow-ledger checks) under the composed bundle.
        run: cargo test -p liquid-cells-stf --features "compact_smt reject_high_s da_varint htlc_sha256 htlc_keyspace"
      - name: Build the lc-exit DA-reconstruction CLI (feature-gated, RPC)
        run: cargo build -p liquid-cells-client --features cli
      - name: Run the generic payment-pool example (the dev "hello world")
        run: cargo run -p liquid-cells-client --example payment_pool

  contract-tests:
    name: Anchor contract + red-team suite (CKB-VM)
    runs-on: ubuntu-24.04
    # ckb-std builds a small C shim for the RISC-V target through cc-rs, which looks for
    # riscv64-unknown-elf-gcc unless told otherwise. clang targets RISC-V out of the box.
    env:
      CC_riscv64imac_unknown_none_elf: clang
      AR_riscv64imac_unknown_none_elf: llvm-ar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64imac-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
      - name: Install riscv build deps
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Build the anchor contract (riscv64imac-unknown-none-elf)
        working-directory: crates/ckb-contract
        run: cargo build --release
      - name: Run the contract + redteam_*.rs suites through CKB-VM
        working-directory: crates/ckb-contract-tests
        run: cargo test
      - name: Re-bake go-evidence -- build the anchor under the deployed-format bundle features
        working-directory: crates/ckb-contract
        run: cargo build --release --features "htlc_keyspace compact_smt"
      - name: Run the escape + redteam suites under the deployed-format bundle (htlc_keyspace + compact_smt)
        working-directory: crates/ckb-contract-tests
        run: cargo test --features "htlc_keyspace compact_smt"

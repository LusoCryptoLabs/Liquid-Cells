version: 2
updates:
  # Only security updates for packages: open-pull-requests-limit 0 turns off version updates.
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/crates/ckb-contract"
      - "/crates/ckb-contract-tests"
      - "/crates/demo-ui"
      - "/crates/groth16"
      - "/crates/sp1-guest"
      - "/crates/sp1-host"
      - "/crates/verifier-difftest"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

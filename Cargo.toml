# Liquid Cells, Cargo workspace.
#
# The keystone crate `liquid-cells-stf` holds the deterministic state-transition
# function. It is executed verbatim by the off-chain sequencer AND proven verbatim
# by the SP1 zkVM guest, so the two can never disagree on a root.
#
# `crates/sequencer` runs the STF off-chain, accepts signed intents, and seals successive
# checkpoints, it depends only on the STF (no sp1-sdk), so it stays in this lean workspace.
# The SP1 guest/host and the on-chain contract live outside it (heavy / cross-target deps):
#   crates/sp1-guest, wraps the STF as an SP1 program, emits a Groth16 proof
#   crates/ckb-contract, anchor type script: Groth16 verify + public-input binding
[workspace]
resolver = "2"
members = ["crates/stf", "crates/sequencer", "crates/client", "crates/demo-ui"]
# The SP1 guest (zkVM target) and host (heavy sp1-sdk dep) are standalone crates so
# `cargo test` at the root stays lean. They depend on the stf crate by path. `crates/wasm` is a
# wasm32 cdylib (the browser SDK), also standalone so the lean native workspace ignores it.
exclude = ["crates/sp1-guest", "crates/sp1-host", "crates/ckb-contract", "crates/ckb-contract-tests", "crates/wasm"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/tecmeup123/Liquid-Cells"

[profile.release]
opt-level = 3
lto = true
